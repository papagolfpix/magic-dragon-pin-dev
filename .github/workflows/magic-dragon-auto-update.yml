name: Install Magic Dragon update ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: magic-dragon-pin-dev-deploy
  cancel-in-progress: false

jobs:
  install-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest uploaded ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "No ZIP file found. Nothing to install."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate and extract update
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"
          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          SOURCE_DIR="$TEMP_DIR"

          if [ ! -f "$SOURCE_DIR/index.html" ]; then
            TOP_DIRS="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
            TOP_FILES="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"

            if [ "$TOP_DIRS" = "1" ] && [ "$TOP_FILES" = "0" ]; then
              SOURCE_DIR="$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            fi
          fi

          if [ ! -f "$SOURCE_DIR/index.html" ]; then
            echo "::error::Update cancelled: index.html was not found in the ZIP."
            exit 1
          fi

          echo "Validated deployment source: $SOURCE_DIR"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ZIP_FILE"

      - name: Commit installed update
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Magic Dragon Auto Updater"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No deployed file changes detected."
            exit 0
          fi

          git commit -m "Install uploaded Magic Dragon update"
          git push
